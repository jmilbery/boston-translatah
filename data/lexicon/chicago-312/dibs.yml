term: dibs
means: a claim on a parking spot you shovelled out, marked by furniture
region: chicago-312
register: 1
part_of_speech: noun
example: "Don't even think about it, that's dibs."
notes: >-
  A winter institution. You dig your car out, you put a lawn chair or a crate in the hole, and the spot is yours until the thaw. Enforced entirely by neighbourhood consensus and rarely by the city.
