term: frunchroom
means: the front room, the one guests get shown into
region: chicago-312
register: 3
part_of_speech: noun
example: "Put your coat in the frunchroom."
notes: >-
  Deep local, and one of the few Chicago words that is a pronunciation rather than a vocabulary item written down. The room other places call the living room.
