term: gym shoes
means: athletic shoes, what most of the country calls sneakers
region: chicago-312
register: 2
part_of_speech: noun
example: "You'll want gym shoes, we're walking."
notes: >-
  One of the cleanest regional splits in American English: sneakers on the coasts, tennis shoes across much of the West and South, gym shoes in Chicago.
