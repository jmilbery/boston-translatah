term: Boogietown
means: Brockton, Massachusetts
region: brockton-508
register: 2
part_of_speech: noun
example: "He's Boogietown born and raised — Champion City."
notes: >-
  Brockton's nickname. Home of Rocky Marciano and Marvin Hagler, hence "City of
  Champions" / "Champion City." Carries the harder, working-class South Shore
  register, not the collegiate city-Boston one.
sources:
