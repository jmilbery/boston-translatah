term: elastic
means: rubber band (also a hair tie)
region: boston
register: 2
part_of_speech: noun
example: "Toss me an elastic, these receipts are all ovah the cah."
notes: >-
  Outsiders hear "elastic" and picture the waistband of their sweatpants.
  Locals mean the little rubber band in the junk drawer, and the hair tie
  around their wrist.
