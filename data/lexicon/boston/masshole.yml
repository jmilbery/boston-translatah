term: Masshole
means: a Massachusetts driver or resident (worn with pride)
region: boston
register: 1
part_of_speech: noun
example: "Cut me off, then waved — total Masshole."
notes: Portmanteau of Massachusetts + a-hole. In the OED since 2015.
sources:
