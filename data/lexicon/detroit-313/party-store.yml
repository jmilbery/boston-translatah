term: party store
means: a corner shop that sells beer and liquor
region: detroit-313
register: 1
part_of_speech: noun
example: "Run to the party store, we're out of ice."
notes: >-
  Nothing to do with parties. The everyday Michigan word for what other places call a package store, a bodega, or a corner store, and a reliable way to spot a transplant who orders a cake at one.
sources:
