term: coney
means: a hot dog under chilli, mustard and diced onion, or the diner that serves it
region: detroit-313
register: 1
part_of_speech: noun
example: "Two coneys and a Vernors."
notes: >-
  Both the food and the restaurant. Detroit's two most famous coney islands sit next door to each other downtown and locals hold firm opinions about which is correct.
