term: Vernors
means: ginger ale, any brand of it
region: detroit-313
register: 2
part_of_speech: noun
example: "Flat Vernors, that's what my mum gave us for a bad stomach."
notes: >-
  A Detroit soft drink old enough that its name became the category, the way other places genericised a brand of tissue. Also the standard home remedy for an upset stomach.
