term: hoagie
means: a submarine sandwich; meats, cheese and lettuce on a long roll
region: philly-215
register: 1
part_of_speech: noun
example: "Grab me an Italian hoagie from the corner store."
notes: >-
  Where the name came from is disputed (Hog Island shipyard stories, a South
  Philly lunch counter, a Delaware County family). Also common in Pittsburgh.
  Mayor Ed Rendell named it the Official Sandwich of Philadelphia in 1992.
