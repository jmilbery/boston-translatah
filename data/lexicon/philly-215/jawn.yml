term: jawn
means: an all-purpose noun; a stand-in for almost any thing, place, event or person
region: philly-215
register: 2
part_of_speech: noun
example: "Hand me that jawn on the counter."
notes: >-
  Developed as a Philadelphia variant of "joint," sometime in the 1980s.
  Philadelphia Magazine traces it through hip-hop and African American
  Vernacular English: Philadelphia made the pronunciation, but the meaning
  already existed. Use it the way locals do, as a noun for nearly anything.
sources:
  - type: url
    ref: https://www.phillymag.com/news/2021/09/15/jawn-origin-philadelphia/
