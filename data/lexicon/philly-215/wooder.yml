term: wooder
means: water
region: philly-215
register: 1
part_of_speech: noun
example: "Wooder bill, wooder ice, wait an hour before you go in the wooder."
notes: >-
  A folk spelling of the Philadelphia pronunciation, first printed by an
  Inquirer columnist in 1981 and now a badge of local authenticity. Linguists
  trace the sound to speakers born around 1900 to 1910; younger speakers say
  it less. See water-to-wooder in data/pronunciation/philly-215.yml.
