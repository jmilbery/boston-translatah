term: Gravois
means: a major south-city street — said "GRAV-oy," never the French "grav-wah"
region: stl-314
register: 2
part_of_speech: noun
example: "Head down Gravois till you hit Grand."
notes: >-
  St. Louis is full of French place names that were flattened by later
  non-French settlers. Saying them the correct French way is the fastest
  possible way to announce you are not from here. See also Chouteau
  ("SHOW-doh") and Carondelet ("kuh-RON-duh-LET").
sources:
