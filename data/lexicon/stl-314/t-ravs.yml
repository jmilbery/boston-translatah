term: t-ravs
means: toasted ravioli — breaded, deep-fried ravioli
also: [toasted ravioli, toasted rav]
region: stl-314
register: 2
part_of_speech: noun
example: "Get an order of t-ravs for the table."
notes: Invented and popularized in St. Louis, reportedly on the Hill. An appetizer, never an entree.
