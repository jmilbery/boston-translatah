term: Missour-uh
means: Missouri
region: stl-314
register: 3
part_of_speech: noun
example: "Born and raised in Missour-uh."
notes: >-
  The older, more rural pronunciation. St. Louis proper mostly says
  "Missour-ee"; "Missour-uh" reads as older or from further out, and carries
  some stigma as old-fashioned. Use it at the top of the dial only.
sources:
  - type: url
    ref: https://www.mentalfloss.com/language/slang/st-louis-slang-terms
