term: Farty-Far
means: Interstate 44
region: stl-314
register: 2
part_of_speech: noun
example: "Take Farty-Far out past Hampton."
notes: >-
  The or-to-ar shift applied to a road number until it became the road's name.
  Highway 40 gets the same treatment as "Farty" — and locals still say
  "Highway Farty" for the road the signs now call I-64.
