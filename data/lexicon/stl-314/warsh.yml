term: warsh
means: wash
region: stl-314
register: 2
part_of_speech: verb
example: "Warsh your hands before you sit down."
notes: >-
  An intrusive R, which is the joke of this whole region file — Boston deletes
  R's, St. Louis inserts them. Mostly older speakers now, and fading.
sources:
