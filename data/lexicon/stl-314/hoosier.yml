term: hoosier
means: an unrefined or uncouth person
region: stl-314
register: 1
part_of_speech: noun
example: "He mowed the lawn in jorts and boots — total hoosier."
notes: >-
  The defining St. Louis word, and the one that confuses everybody else. In
  Indiana it's a proud demonym; in St. Louis it kept the older 19th-century
  Southern sense of a rustic or roughneck. It's an insult about somebody's
  taste and manners, aimed at an individual — the equivalent of the Boston
  lexicon's own "chowderhead" or "hardo," not a term for a group.
