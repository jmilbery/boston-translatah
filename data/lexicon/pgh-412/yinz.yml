term: yinz
means: you all; plural you
also: [yinz guys]
region: pgh-412
register: 1
part_of_speech: phrase
example: "Yinz wanna go dahntahn?"
notes: >-
  The word on the T-shirts, and the root of "yinzer." Found across Appalachia,
  but it's Pittsburgh's flag. Locals claim to hate it and keep saying it.
