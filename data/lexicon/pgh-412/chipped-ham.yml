term: chipped ham
means: chipped chopped ham; processed ham lunch meat sliced paper-thin
also: [chipped chopped ham]
region: pgh-412
register: 2
part_of_speech: noun
example: "A pound of chipped ham, please."
notes: Associated with Isaly's; the company behind it has been around for more than a century.
