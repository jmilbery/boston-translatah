term: the Phog
means: Allen Fieldhouse, KU's basketball arena in Lawrence
region: kansas
register: 2
part_of_speech: noun
example: "Nobody wins on the road at the Phog."
notes: >-
  The nickname honors Phog Allen, the coach the arena is named for. A banner
  inside reads "Beware of the Phog."
sources:
