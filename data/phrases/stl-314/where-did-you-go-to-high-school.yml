phrase: "So what's your background?"
local: "Where'd you go to high school?"
respelling: "wherd-joo go to high school"
region: stl-314
notes: >-
  The single most St. Louis thing anybody says. Asked within minutes of
  meeting someone, it's a one-question shortcut to neighborhood, religion and
  class. Outsiders hear small talk; locals are reading a map.
sources:
  - type: url
    ref: https://www.mentalfloss.com/language/slang/st-louis-slang-terms
