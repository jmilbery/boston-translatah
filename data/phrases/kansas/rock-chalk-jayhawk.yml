phrase: "Go KU, see you around."
local: "Rock chalk"
region: kansas
notes: >-
  Fans chant "Rock chalk, Jayhawk, KU" at University of Kansas games, and
  Wikipedia gives the same wording. In conversation, people shorten it to
  "Rock chalk." KU fans say it when they pass another fan, or to close a
  conversation about KU sports. It belongs to KU fans and does not speak for
  the whole state.
sources:
