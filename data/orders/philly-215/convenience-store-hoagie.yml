order: convenience store hoagie
region: philly-215
local: "I'm stopping at Wawa. You want a hoagie?"
moves:
  - "In eastern Pennsylvania the convenience store is Wawa. Out west, around Pittsburgh, it's Sheetz, and people pick a side."
takes:
  - mood: love
    line: "Wawa wins on hoagies, and it's the bread. Philly bread is just better."
    voice: an eastern Pennsylvanian
  - mood: shrug
    line: "No, there's no secret deal splitting the state between them. Wawa's own president said so. We just like ours better."
register: 2
contested: true
notes: >-
  See the lexicon entries Wawa and hoagie, and the mirror order
  data/orders/pgh-412/convenience-store-sandwich.yml. Which chain is better is
  the argument, so it's marked contested. The "gentlemen's agreement" to stay
  out of each other's territory is an urban legend: Wawa's president has said
  no such agreement ever existed.
