order: soft pretzel
region: philly-215
local: "A soft pretzel with mustard."
moves:
  - "A Philly pretzel is a figure-8, thick in the middle, not the loopy kind."
  - "Look for them on street corners, not in the supermarket."
takes:
  - mood: love
    line: "Breakfast on the walk to work, out of a paper bag. Mustard on top if you're doing it right."
register: 1
notes: >-
  The Encyclopedia of Greater Philadelphia traces the mustard to hot dog
  vendors, who sold pretzels and already had the mustard out.
