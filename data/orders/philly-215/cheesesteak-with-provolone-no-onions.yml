order: cheesesteak with provolone, no onions
region: philly-215
local: "Provolone witout."
moves:
  - "Same two calls as any cheesesteak: cheese, then onions. Witout means no onions. You'll also see it spelled widout."
  - "American works the same way: \"American wit,\" \"American witout.\""
takes:
  - mood: shrug
    line: "Whiz, provolone, American: all three are correct. Arguing about which is most correct is also correct."
register: 1
notes: >-
  See the lexicon entries wit and witout, and cheesesteak-with-cheez-whiz-and-onions.yml
  for counter etiquette. The three cheeses come straight from the guides;
  provolone is the sharp one, American the creamy one.
sources:
