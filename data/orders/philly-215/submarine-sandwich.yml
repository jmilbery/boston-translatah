order: submarine sandwich
region: philly-215
local: "A hoagie."
slot: long-sandwich
moves:
  - "Meats, cheese and lettuce on a long roll is a hoagie here. Sub is the New York word."
takes:
  - mood: love
    line: "Every corner store makes one and every family has a favorite. It's a hoagie."
  - mood: shrug
    line: "Where the name came from is a Philly argument: the Hog Island shipyard, a South Philly lunch counter, a family in Chester. Pick a story and eat the sandwich."
register: 1
contested: true
notes: >-
  See the lexicon entry hoagie. Dialect maps show the hoagie/sub line running
  between Philadelphia and New York; the word also turns up in Pittsburgh
  (see data/orders/pgh-412/submarine-sandwich.yml). The origin of the name is
  disputed: several Hog Island stories, the DePalma family's luncheonette, and
  the DiCostanza family in Delaware County all have claims. Don't name a
  winner.
sources:
  - type: url
    ref: https://www.inquirer.com/food/hoagie-philadelphia-history-sub-20240715.html
  - type: url
    ref: https://www.csmonitor.com/The-Culture/Verbal-Energy/2016/1124/American-speech-mapped-in-vivid-color
