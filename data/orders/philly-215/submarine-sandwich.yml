order: submarine sandwich
region: philly-215
local: "A hoagie."
slot: long-sandwich
moves:
  - "Meats, cheese and lettuce on a long roll is a hoagie here. Most of the country says sub."
takes:
  - mood: love
    line: "Every corner store makes one and every family has a favorite. It's a hoagie."
  - mood: shrug
    line: "Where the name came from is a Philly argument: the Hog Island shipyard, a South Philly lunch counter, a family in Chester. Pick a story and eat the sandwich."
register: 1
contested: true
notes: >-
  See the lexicon entry hoagie. A dialect survey by a North Carolina State
  graduate student set out to map where hoagie gives way to sub; the word
  also turns up in Pittsburgh (see data/orders/pgh-412/submarine-sandwich.yml). The origin of the name is
  disputed: several Hog Island stories, the DePalma family's luncheonette, and
  the DiCostanza family in Delaware County all have claims. Don't name a
  winner. In 1992 Mayor Ed Rendell named the hoagie the Official Sandwich of
  Philadelphia; that's a city designation, not a state one.
sources:
