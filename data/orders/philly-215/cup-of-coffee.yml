    line: "My grandmother says cawfee, my nephew says coffee. Both of them still want it hot."
register: 1
notes: >-
  Here for the vowel, not the order: Philadelphia has no one-word code like
  Boston's "regular" that we could source, so ask for what you want in it.
  The spoken line is a folk spelling from the aw-raising rule in
  data/pronunciation/philly-215.yml (dial 3). Labov's team finds it fading:
  more Philadelphians now say "coffee."
