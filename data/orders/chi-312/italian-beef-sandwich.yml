order: Italian beef sandwich
region: chi-312
local: "Beef, hot, dipped."
spoken: "Beef, hat, dipped."
slot: signature-sandwich
moves:
  - "Two calls. Peppers first: sweet (roasted bell peppers) or hot (giardiniera), or both. Then the juice: dry, wet or dipped."
  - "Dry is drained before it goes on the bread, wet gets extra juice, dipped means the whole sandwich goes into the jus."
  - "Dry, wet or dipped is the question you'll get. Decide before you reach the counter."
  - "Lean over the counter to eat it. Locals call it the Chicago lean."
takes:
  - mood: love
    line: "Hot, dipped, and lean over the counter. Your shirt's a sacrifice and it's worth it."
  - mood: shrug
    line: "Dry, wet or dipped, everybody's sure theirs is right. Try all three and pick a side."
register: 1
notes: >-
  See the lexicon entries beef, giardiniera and dipped. Locals just call it a
  beef. The spoken line is a folk spelling from the light Northern Cities
  Shift rule, northern-cities-shift-light in data/pronunciation/chi-312.yml
  ("hot" to "hat"), dial 3 only
  and receding among younger Chicagoans.
sources:
