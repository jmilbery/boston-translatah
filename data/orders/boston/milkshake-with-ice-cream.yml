order: milkshake with ice cream
region: boston
local: "A frappe."
slot: ice-cream-shake
moves:
  - "Say it \"frap.\" One syllable."
  - "Ask for a \"milkshake\" and you may get milk and syrup shaken up, no ice cream. If you want ice cream in it, it's a frappe."
takes:
  - mood: love
    line: "A frappe is the only milkshake worth ordering. Thick, cold, done."
  - mood: shrug
    line: "Every summer somebody from away orders a milkshake and looks into the cup for the ice cream. We've all been there, or we've all watched it."
register: 2
notes: >-
  See the lexicon entry frappe. A frappe is milk, syrup and ice cream blended;
  a New England "milkshake" is milk and syrup without ice cream. In Rhode
  Island and parts of southeastern Massachusetts the same drink is a cabinet
  (see rhode-island-coffee-frappe.yml).
sources:
