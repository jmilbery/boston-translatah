order: large iced coffee with cream and sugar
region: boston
local: "Large iced regular."
spoken: "Lahge iced regulah."
slot: coffee-regular
moves:
  - "A large regular is four creams and four sugars. Ask for something else if you want it lighter."
  - "Plenty of locals drink it iced all year, even when it's below freezing out."
takes:
  - mood: love
    line: "Iced, in February, with the snowbanks taller than you. It's coffee, not a weather report."
register: 2
notes: >-
  See the lexicon entries regular and Dunks. The spoken line is a folk
  spelling (drop-final-r in data/pronunciation/rules.yml: "large" and
  "regular" both lose the R). Younger speakers drop it less and less. Sources
  give the cream and sugar counts for coffee in general; they don't say
  whether iced is made the same way.
sources:
