order: Rhode Island coffee frappe
region: boston
local: "A coffee cabinet."
spoken: "A cawfee cabinet."
slot: ice-cream-shake
moves:
  - "In Rhode Island and parts of southeastern Massachusetts, the frappe is called a cabinet."
  - "Coffee is the classic flavor, made with coffee syrup."
takes:
  - mood: love
    line: "Same drink as a frappe. It's named after the cabinet the blender lived in, and we're keeping the name."
register: 3
notes: >-
  Rhode Island usage, filed under boston because that region covers general
  New England. The name supposedly comes from where the blender was kept. The
  spoken line is a folk spelling from the o-to-aw rule in
  data/pronunciation/rules.yml (coffee is its own example), a dial-3 feature.
