order: St. Louis-style pizza
region: stl-314
local: "A large."
moves:
  - "The crust is thin enough to crack. That's the point."
  - "The cheese is Provel, not mozzarella."
  - "It comes cut in small squares, not wedges. Grab a corner."
takes:
  - mood: love
    line: "Cracker crust, Provel, squares. That's pizza."
  - mood: shrug
    line: "Provel is divisive and we know it. More for us."
register: 1
notes: >-
  Square cut is standard; you don't ask for it. See the lexicon entry
  Provel: a processed blend of cheddar, Swiss and provolone with a low
  melting point that breaks off clean when you bite it. The guides call it
  divisive: beloved here, baffling to plenty of visitors, and arguing about
  it is half the fun.
sources:
