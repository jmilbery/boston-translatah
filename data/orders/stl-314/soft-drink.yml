order: soft drink
region: stl-314
local: "And a soda to wash it down."
spoken: "And a soda to warsh it down."
slot: soda
moves:
  - "It's soda here, not pop, even though plenty of the Midwest around the city says pop."
takes:
  - mood: shrug
    line: "We say soda. Drive a few hours out and you'll hear pop, and that's fine too."
register: 1
notes: >-
  St. Louis shows up on the soda-versus-pop maps as a soda island. The spoken
  line is a folk spelling from the intrusive-r-wash rule in
  data/pronunciation/stl-314.yml (dial 3, that word family only). See the
  lexicon entry warsh: it's mostly older speakers now, and the city's
  accent features are stronger among baby boomers than millennials.
sources:
