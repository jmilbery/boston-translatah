name: Validate entries

# The robot that runs on every pull request. It checks that each new slang file
# matches the schema and cites a source. If it goes red, read the log — that
# feedback loop is the whole lesson.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # This name is what GitHub publishes as the status check, and branch
    # protection on main requires a context spelled exactly "Validate entries".
    # Without it the check reports as the job id ("validate"), the required
    # context never arrives, and every PR blocks forever. Don't rename it.
    name: Validate entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
